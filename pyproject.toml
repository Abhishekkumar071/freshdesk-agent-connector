[project]
name = "freshdesk-connector"
version = "0.1.0"
description = "Read-only Freshdesk ticket connector for AI agents, exposed as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]
